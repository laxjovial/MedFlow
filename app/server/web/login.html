<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — MedFlow</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-mark">M</div>
      <div>
        <h1>Welcome back</h1>
        <p class="muted">Sign in to your clinic workspace</p>
      </div>
    </div>

    <form id="login-form">
      <label>Username or email
        <input id="login-user" autocomplete="username" required>
      </label>
      <label>Password
        <input id="login-pass" type="password" autocomplete="current-password" required>
      </label>
      <label class="check-row"><input type="checkbox" id="login-remember" checked> Stay signed in on this computer <span class="hint-inline">(up to a week)</span></label>
      <p id="login-error" class="error hidden"></p>
      <button class="btn primary full" type="submit">Sign in</button>
    </form>

    <div class="or-sep">or</div>
    <button id="google-btn" class="btn google full">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.2 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.4 5.8c4.4-4.1 7.2-10.1 7.2-17.5z"/><path fill="#FBBC05" d="M10.4 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.8-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.6 10.8l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.6l-7.4-5.8c-2 1.4-4.6 2.2-7.8 2.2-6.3 0-11.7-3.7-13.6-9.8l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
      Continue with Google
    </button>
    <p id="google-note" class="muted small hidden">Google sign-in is not enabled on this server.</p>

    <p class="auth-alt">New here? <a href="/signup">Create an account</a></p>
    <p class="muted small" style="text-align:center">Local-first: your records stay on your machine.</p>
  </div>
</div>

<script src="/static/auth.js"></script>
</body>
</html>
